{% extends "base.html" %}

{% block title %}System Error - Bus Campus Connect{% endblock %}

{% block content %}
<div class="student-content" style="max-width: 550px; margin: 4rem auto; text-align: center;">
  <div class="card" style="padding: 3rem 2rem;">
    <div style="font-size: 3.5rem; font-weight: 900; color: var(--danger);">500</div>
    <h2 style="font-size: 1.5rem; font-weight: 800; margin: 0.5rem 0 1rem;">Internal System Error</h2>
    <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 2rem;">
      An unexpected internal condition occurred. The campus transport system has logged this incident.
    </p>
    <a href="{{ url_for('landing') }}" class="btn btn-primary">Return to Safety &rarr;</a>
  </div>
</div>
{% endblock %}
