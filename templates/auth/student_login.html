{% extends "base.html" %}

{% block title %}Student Login - Bus Campus Connect{% endblock %}

{% block content %}
<div class="student-content" style="max-width: 480px; margin: 3rem auto;">
  <div class="card" style="box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 54px; height: 54px; background: var(--primary-light); color: var(--primary); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 800;">Student Portal Login</h2>
      <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.35rem;">
        Enter your Register Number or email to access your travel schedule.
      </p>
    </div>

    <form action="{{ url_for('auth.login_student') }}" method="POST">
      <div class="form-group">
        <label class="form-label">Register Number or Email <span class="required">*</span></label>
        <input type="text" name="identifier" class="form-control" placeholder="Enter Register Number or Email" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password <span class="required">*</span></label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>

      <div style="margin-top: 1.75rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
          Log In to Student Dashboard &rarr;
        </button>
      </div>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); text-align: center; font-size: 0.88rem;">
      <span style="color: var(--text-secondary);">Don't have an account yet?</span>
      <a href="{{ url_for('auth.register') }}" style="font-weight: 700; margin-left: 0.35rem;">Register Here</a>
      <div style="margin-top: 0.75rem;">
        <a href="{{ url_for('auth.login_management') }}" style="font-size: 0.82rem; color: var(--text-muted);">
          Switch to Management Login &rarr;
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
