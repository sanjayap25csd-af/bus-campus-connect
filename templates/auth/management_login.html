{% extends "base.html" %}

{% block title %}Management Login - Bus Campus Connect{% endblock %}

{% block content %}
<div class="student-content" style="max-width: 480px; margin: 3rem auto;">
  <div class="card" style="box-shadow: var(--shadow-lg); border-top: 4px solid var(--bg-sidebar);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 54px; height: 54px; background: #0f172a; color: #ffffff; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 800;">Management Login</h2>
      <p style="color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.35rem;">
        Campus Transport Logistics Console
      </p>
    </div>

    <form action="{{ url_for('auth.login_management') }}" method="POST">
      <div class="form-group">
        <label class="form-label">Management Email <span class="required">*</span></label>
        <input type="email" name="email" class="form-control" placeholder="Enter management email" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password <span class="required">*</span></label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>

      <div style="margin-top: 1.75rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; background: #0f172a; border-color: #0f172a;">
          Access Management Console &rarr;
        </button>
      </div>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); text-align: center; font-size: 0.88rem;">
      <a href="{{ url_for('auth.login_student') }}" style="color: var(--text-secondary);">
        &larr; Switch to Student Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
